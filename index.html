<script>
"use strict";

/* =========================================================
   AUNG RECAP PRO V8.1.2 FRONTEND
   Upload → Analyze → Poll → Result
   Rate Limit Protection
========================================================= */

  "https://aung-recap-pro-v8-1.onrender.com";

const MAX_FILE_SIZE =
  500 * 1024 * 1024;

let selectedFile = null;
let currentJobId = null;
let pollTimer = null;
let uploadBusy = false;
let analysisBusy = false;
let retryCountdownTimer = null;

/* =========================================================
   ELEMENT HELPER
========================================================= */

const $ = (id) =>
  document.getElementById(id);

/* =========================================================
   ELEMENTS
========================================================= */

const sidebar =
  $("sidebar");

const overlay =
  $("overlay");

const mobileMenu =
  $("mobileMenu");

const chooseBtn =
  $("chooseBtn");

const videoInput =

const dropzone =
  $("dropzone");

const uploadBtn =
  $("uploadBtn");

const resetBtn =
  $("resetBtn");

const analyzeBtn =
  $("analyzeBtn");

const fileInfo =
  $("fileInfo");

const fileName =
  $("fileName");

const fileMeta =
  $("fileMeta");

const uploadProgressWrap =
  $("uploadProgressWrap");

const uploadProgress =

const uploadPercent =
  $("uploadPercent");

const uploadStage =
  $("uploadStage");

const analysisPanel =
  $("analysisPanel");

const analysisStatus =
  $("analysisStatus");

const analysisStage =
  $("analysisStage");

const analysisProgress =
  $("analysisProgress");

const analysisPercent =
  $("analysisPercent");

const analysisProgressText =
  $("analysisProgressText");

const analysisActions =

const retryBtn =
  $("retryBtn");

const continueBtn =
  $("continueBtn");

  $("toast");

/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(message) {

  clearTimeout(
    toastTimer
  );

  toast.textContent =
    String(message || "");

  toast.classList.add(
    "show"
  );

  toastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    }, 4000);
}

/* =========================================================
   FORMAT BYTES
========================================================= */

function formatBytes(bytes) {

  if (
    !Number.isFinite(bytes)
  ) {
    return "Unknown size";
  }

  if (
    bytes < 1024
  ) {
    return `${bytes} B`;
  }

  if (
    bytes <
    1024 * 1024
  ) {
    return `${(
      bytes / 1024
    ).toFixed(1)} KB`;
  }

  if (
    bytes <
    1024 *
    1024 *
    1024
  ) {
    return `${(
      bytes /
      (1024 * 1024)
    ).toFixed(1)} MB`;
  }

  return `${(
    bytes /
    (1024 *
      1024 *
      1024)
  ).toFixed(2)} GB`;
}

/* =========================================================
   API HEALTH
========================================================= */

async function checkApi() {

  const dot =
    $("apiDot");

  const text =
    $("apiText");

  try {

    const response =
      await fetch(
        `${API_BASE}/health`,
        {
          method:
            "GET",

          cache:
            "no-store"
        }
      );

    if (
      !response.ok
    ) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    if (
      data &&
      data.ok === true &&
      data.status ===
        "healthy"
    ) {

      dot.className =
        "api-dot online";

      text.textContent =
        `API Online • ${
          data.version ||
          "V8"
        }`;

      return true;
    }

    throw new Error(
      "API unhealthy"
    );

  } catch (error) {

    console.error(
      "API HEALTH:",
      error
    );

    dot.className =
      "api-dot error";

    text.textContent =
      "API Offline";

    return false;
  }
}

/* =========================================================
   MOBILE MENU
========================================================= */

function openMenu() {

  );

  overlay.classList.add(
    "show"
  );
}

function closeMenu() {

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(

}

mobileMenu.addEventListener(

);

/* =========================================================

const pageNames = {

  studio:
    "Recap Studio",

  projects:
    "Projects",

  voice:
    "AI Voice",

  subtitles:
    "Subtitles",

  settings:
    "Settings"
};

document

          button.classList.add(

/* =========================================================
   FILE SELECTION
========================================================= */

function handleFile(file) {

  if (!file) {
    return;
  }

  if (
    !file.type ||
    !file.type.startsWith(
      "video/"
    )
  ) {

    showToast(
      "Please select a video file"
    );

    return;
  }

  if (
    file.size >
    MAX_FILE_SIZE
  ) {

    showToast(
      "Video must be 500 MB or smaller"
    );

    return;
  }

  selectedFile =
    file;

  currentJobId =
    null;

  analyzeBtn.disabled =
    true;

  uploadBtn.disabled =
    false;

  fileName.textContent =
    file.name;

  fileMeta.textContent =
    `${formatBytes(
      file.size
    )} • ${
      file.type ||
      "video"
    }`;

  fileInfo.classList.add(
    "show"
  );

  analysisPanel.classList.remove(
    "show"
  );

  showToast(
    "Video selected — click Upload Video"
  );
}

  "click",
  () => {
    videoInput.click();
  }
);

videoInput.addEventListener(
  "change",
  () => {

    const file =
      videoInput.files?.[0];

    handleFile(file);
  }
);

/* =========================================================
   DRAG & DROP
========================================================= */

[

  "dragover"
].forEach(
  (eventName) => {

    dropzone.addEventListener(
      eventName,
      (event) => {

        event.preventDefault();

        event.stopPropagation();

        dropzone.classList.add(
          "drag"
        );
      }
    );
  }
);

[
  "dragleave",
  "drop"
].forEach(
  (eventName) => {

    dropzone.addEventListener(
      eventName,
      (event) => {

        event.preventDefault();

        event.stopPropagation();

        dropzone.classList.remove(
          "drag"
        );
      }
    );
  }
);

dropzone.addEventListener(
  "drop",
  (event) => {

    const file =
      event
        .dataTransfer
        ?.files?.[0];

    handleFile(file);
  }
);

/* =========================================================
   RESET

  currentJobId =
    null;

  uploadBusy =
    false;

  analysisBusy =
    false;

    "";

    "show"
  );

  uploadProgressWrap.classList.remove(
    "show"
  );

  uploadProgress.style.width =
    "0%";

  uploadPercent.textContent =

  uploadStage.textContent =

    true;

  $("sceneCount").textContent =

/* =========================================================
   UPLOAD VIDEO
========================================================= */

function uploadVideo() {

  if (
    !selectedFile ||
    uploadBusy
  ) {

    if (
      !selectedFile
    ) {
      showToast(
        "Choose a video first"
      );
    }

    return;
  }

  uploadBusy =
    true;

  currentJobId =
    null;

  uploadBtn.disabled =
    true;

  analyzeBtn.disabled =
    true;

  uploadProgressWrap.classList.add(
    "show"
  );

  uploadStage.textContent =
    "Uploading video";

  uploadPercent.textContent =
    "0%";

  uploadProgress.style.width =
    "0%";

  const xhr =
    new XMLHttpRequest();

  xhr.open(
    "POST",
    `${API_BASE}/api/upload`,
    true
  );

  xhr.responseType =
    "json";

  xhr.upload.addEventListener(
    "progress",
    (event) => {

      if (
        !event.lengthComputable
      ) {
        return;
      }

      const percent =
        Math.round(
          (
            event.loaded /
            event.total
          ) * 100
        );

      uploadProgress.style.width =
        `${percent}%`;

      uploadPercent.textContent =
        `${percent}%`;

      uploadStage.textContent =
        percent >= 100
          ? "Processing upload..."
          : "Uploading video";
    }
  );

  xhr.addEventListener(
    "load",
    () => {

      uploadBusy =
        false;

      let data =
        xhr.response;

      if (
        !data &&
        xhr.responseText
      ) {

        try {
          data =
            JSON.parse(
              xhr.responseText
            );
        } catch {
          data =
            null;
        }
      }

      if (
        xhr.status >= 200 &&
        xhr.status < 300
      ) {

        /*
         * BACKEND RETURNS:
         *
         * {
         *   ok: true,
         *   jobId: "..."
         * }
         *
         * Older frontend expected:
         *
         * data.job.id
         *
         * We support BOTH formats
         */

        const jobId =
          data?.jobId ||
          data?.job?.id ||
          data?.id ||
          null;

        if (!jobId) {

          console.error(
            "INVALID UPLOAD RESPONSE:",
            data
          );

          uploadBtn.disabled =
            false;

          showToast(
            "Upload completed but Job ID was not received"
          );

          return;
        }

        currentJobId =
          String(jobId);

        uploadProgress.style.width =
          "100%";

        uploadPercent.textContent =
          "100%";

        uploadStage.textContent =
          "Upload complete";

        /*
         * THIS IS THE IMPORTANT FIX
         */

        analyzeBtn.disabled =
          false;

        showToast(
          "Video uploaded — Analyze Video is ready"
        );

        return;
      }

      const message =
        data?.error ||
        data?.message ||
        `Upload failed (HTTP ${xhr.status})`;

      uploadBtn.disabled =
        false;

      showToast(
        message
      );
    }
  );

  xhr.addEventListener(
    "error",
    () => {

      uploadBusy =
        false;

      uploadBtn.disabled =
        false;

      analyzeBtn.disabled =
        true;

      showToast(
        "Network error during upload"
      );
    }
  );

  xhr.addEventListener(
    "abort",
    () => {

      uploadBusy =
        false;

      uploadBtn.disabled =
        false;

      showToast(
        "Upload cancelled"
      );
    }
  );

  xhr.addEventListener(
    "timeout",
    () => {

      uploadBusy =
        false;

      uploadBtn.disabled =
        false;

      showToast(
        "Upload timed out"
      );
    }
  );

  const formData =
    new FormData();

  formData.append(
    "video",
    selectedFile
  );

  xhr.send(
    formData
  );
}

uploadBtn.addEventListener(
  "click",
  uploadVideo
);

/* =========================================================
   ANALYSIS STATE
========================================================= */

function setAnalysisState(
  state,
  message
) {

  analysisPanel.classList.add(
    "show"
  );

  if (
    state ===
    "running"
  ) {

    analysisStatus.className =
      "status-pill running";

    analysisStatus.textContent =
      "● Analyzing";

    analysisStage.textContent =
      message ||
      "AI is analyzing the video";

    return;
  }

  if (
    state ===
    "waiting"
  ) {

    analysisStatus.className =
      "status-pill running";

    analysisStatus.textContent =
      "● Waiting";

    analysisStage.textContent =
      message ||
      "Waiting for Gemini";

    return;
  }

  if (
    state ===
    "done"
  ) {

    analysisStatus.className =
      "status-pill done";

    analysisStatus.textContent =
      "● Complete";

    analysisStage.textContent =
      message ||
      "AI analysis complete";

    return;
  }

  if (
    state ===
    "failed"
  ) {

    analysisStatus.className =
      "status-pill failed";

    analysisStatus.textContent =
      "● Failed";

    analysisStage.textContent =
      message ||
      "AI analysis failed";

    return;
  }

  analysisStatus.className =
    "status-pill";

  analysisStatus.textContent =
    "● Ready";

  analysisStage.textContent =
    message ||
    "Waiting for analysis";
}

/* =========================================================
   START AI ANALYSIS
========================================================= */

async function startAnalysis() {

  if (
    !currentJobId
  ) {

    showToast(
      "Upload the video first"
    );

    return;
  }

  if (
    analysisBusy
  ) {

    return;
  }

  analysisBusy =
    true;

  analyzeBtn.disabled =
    true;

  analysisPanel.classList.add(
    "show"
  );

  analysisActions.style.display =
    "none";

  setAnalysisState(
    "running",
    "Starting AI analysis..."
  );

  analysisProgress.style.width =
    "10%";

  analysisPercent.textContent =
    "10%";

  analysisProgressText.textContent =
    "Starting AI analysis";

  try {

    const response =
      await fetch(
        `${API_BASE}/api/analyze/${encodeURIComponent(
          currentJobId
        )}/start`,
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              sourceLanguage:
                $("sourceLanguage")
                  ?.value ||
                "auto",

              outputLanguage:
                $("outputLanguage")
                  ?.value ||
                "my",

              outputFormat:
                $("outputFormat")
                  ?.value ||
                "original",

              recapStyle:
                $("recapStyle")
                  ?.value ||
                "cinematic"
            })
        }
      );

    const data =
      await response
        .json()
        .catch(
          () => null
        );

    /*
     * Backend normally returns 200
     * with:
     *
     * {
     *   ok: true,
     *   jobId: "..."
     * }
     */

    if (
      response.status ===
      429
    ) {

      const seconds =
        extractRetrySeconds(
          data
        );

      analysisBusy =
        false;

      startRetryCountdown(
        seconds
      );

      return;
    }

    if (
      !response.ok
    ) {

      throw new Error(
        data?.error ||
        data?.message ||
        `HTTP ${response.status}`
      );
    }

    if (
      data?.jobId
    ) {

      currentJobId =
        String(
          data.jobId
        );
    }

    if (
      data?.result
    ) {

      analysisBusy =
        false;

      renderAnalysis({
        result:
          data.result,

        status:
          "completed",

        progress:
          100
      });

      return;
    }

    /*
     * If backend says already completed
     */

    if (
      data?.alreadyCompleted &&
      data?.result
    ) {

      analysisBusy =
        false;

      renderAnalysis({
        result:
          data.result,

        status:
          "completed",

        progress:
          100
      });

      return;
    }

    showToast(
      "AI analysis started"
    );

    pollJob();

  } catch (error) {

    console.error(
      "ANALYSIS START:",
      error
    );

    if (
      isRateLimitMessage(
        error
      )
    ) {

      analysisBusy =
        false;

      const seconds =
        extractRetrySeconds(
          error
        );

      startRetryCountdown(
        seconds
      );

      return;
    }

    analysisBusy =
      false;

    analyzeBtn.disabled =
      false;

    setAnalysisState(
      "failed",
      error.message ||
      "Could not start AI analysis"
    );

    analysisActions.style.display =
      "block";

    showToast(
      error.message ||
      "Could not start AI analysis"
    );
  }
}

analyzeBtn.addEventListener(
  "click",
  startAnalysis
);

/* =========================================================
   RATE LIMIT HELPERS
========================================================= */

function isRateLimitMessage(
  value
) {

  let message = "";

  if (
    value instanceof Error
  ) {

    message =
      value.message || "";

  } else if (
    typeof value ===
    "string"
  ) {

    message =
      value;

  } else if (
    value
  ) {

    try {

      message =
        JSON.stringify(
          value
        );

    } catch {

      message =
        String(value);
    }
  }

  message =
    message.toLowerCase();

  return (
    message.includes(
      "429"
    ) ||
    message.includes(
      "rate limit"
    ) ||
    message.includes(
      "rate_limit_exceeded"
    ) ||
    message.includes(
      "resource_exhausted"
    ) ||
    message.includes(
      "too many requests"
    )
  );
}

function extractRetrySeconds(
  value
) {

  let message = "";

  if (
    value instanceof Error
  ) {

    message =
      value.message || "";

  } else if (
    typeof value ===
    "string"
  ) {

    message =
      value;

  } else if (
    value
  ) {

    try {

      message =
        JSON.stringify(
          value
        );

    } catch {

      message =
        String(value);
    }
  }

  const patterns = [
    /retry\s+(?:in|after)\s+(\d+)\s*s/i,
    /retry\s+(?:in|after)\s+(\d+)\s*seconds?/i,
    /retryDelay["']?\s*:\s*["']?(\d+)s/i
  ];

  for (
    const pattern of patterns
  ) {

    const match =
      message.match(
        pattern
      );

    if (match) {

      const seconds =
        Number(
          match[1]
        );

      if (
        Number.isFinite(
          seconds
        ) &&
        seconds > 0
      ) {

        return Math.min(
          Math.max(
            seconds,
            5
          ),
          120
        );
      }
    }
  }

  return 60;
}

/* =========================================================
   RATE LIMIT COUNTDOWN
========================================================= */

function startRetryCountdown(
  seconds
) {

  if (
    retryCountdownTimer
  ) {

    clearInterval(
      retryCountdownTimer
    );
  }

  let remaining =
    Math.max(
      1,
      Number(seconds) ||
      60
    );

  analysisPanel.classList.add(
    "show"
  );

  analysisBusy =
    false;

  analyzeBtn.disabled =
    true;

  analysisActions.style.display =
    "none";

  setAnalysisState(
    "waiting",
    `Gemini rate limit reached — retrying in ${remaining}s`
  );

  analysisProgress.style.width =
    "58%";

  analysisPercent.textContent =
    "58%";

  analysisProgressText.textContent =
    `Retry in ${remaining}s`;

  showToast(
    `Gemini rate limit reached — retrying in ${remaining}s`
  );

  retryCountdownTimer =
    setInterval(
      () => {

        remaining--;

        if (
          remaining <= 0
        ) {

          clearInterval(
            retryCountdownTimer
          );

          retryCountdownTimer =
            null;

          if (
            currentJobId
          ) {

            startAnalysis();

          } else {

            analyzeBtn.disabled =
              false;

            setAnalysisState(
              "failed",
              "Upload the video again"
            );
          }

          return;
        }

        analysisStage.textContent =
          `Gemini rate limit reached — retrying in ${remaining}s`;

        analysisProgressText.textContent =
          `Retry in ${remaining}s`;
      },
      1000
    );
}

/* =========================================================
   POLL JOB
========================================================= */

async function pollJob() {

  if (
    !currentJobId
  ) {

    return;
  }

  try {

    const response =
      await fetch(
        `${API_BASE}/api/jobs/${encodeURIComponent(
          currentJobId
        )}`,
        {
          method:
            "GET",

          cache:
            "no-store"
        }
      );

    const data =
      await response
        .json()
        .catch(
          () => null
        );

    if (
      !response.ok ||
      !data?.ok ||
      !data?.job
    ) {

      throw new Error(
        data?.error ||
        "Unable to read job status"
      );
    }

    const job =
      data.job;

    const progress =
      Math.max(
        0,
        Math.min(
          100,
          Number(
            job.progress
          ) || 0
        )
      );

    analysisProgress.style.width =
      `${progress}%`;

    analysisPercent.textContent =
      `${progress}%`;

    /*
     * Backend uses "message"
     * not "stage"
     */

    const message =
      job.message ||
      job.stage ||
      "AI processing";

    analysisProgressText.textContent =
      message;

    if (
      job.status ===
      "completed"
    ) {

      analysisBusy =
        false;

      renderAnalysis(
        job
      );

      return;
    }

    if (
      job.status ===
      "failed"
    ) {

      analysisBusy =
        false;

      /*
       * 429 may have reached
       * final backend retry limit
       */

      if (
        isRateLimitMessage(
          job.error
        )
      ) {

        const seconds =
          extractRetrySeconds(
            job.error
          );

        startRetryCountdown(
          seconds
        );

        return;
      }

      analyzeBtn.disabled =
        false;

      setAnalysisState(
        "failed",
        job.error ||
        "AI analysis failed"
      );

      analysisActions.style.display =
        "block";

      return;
    }

    if (
      job.status ===
        "waiting"
    ) {

      setAnalysisState(
        "waiting",
        message
      );

    } else {

      setAnalysisState(
        "running",
        message
      );
    }

    pollTimer =
      setTimeout(
        pollJob,
        2500
      );

  } catch (error) {

    console.error(
      "JOB POLL:",
      error
    );

    /*
     * Do not immediately fail
     * on temporary network errors
     */

    pollTimer =
      setTimeout(
        pollJob,
        4000
      );
  }
}

/* =========================================================
   RENDER ANALYSIS
========================================================= */

function renderAnalysis(
  job
) {

  /*
   * Backend result structure:
   *
   * job.result.analysis
   *
   * Support older direct format too
   */

  const result =
    job?.result ||
    {};

  const analysis =
    result?.analysis ||
    job?.analysis ||
    {};

  const scenes =
    Array.isArray(
      analysis.scenes
    )
      ? analysis.scenes
      : [];

  const characters =
    Array.isArray(
      analysis.characters
    )
      ? analysis.characters
      : [];

  const events =
    Array.isArray(
      analysis.keyEvents
    )
      ? analysis.keyEvents
      : [];

  $("sceneCount")
    .textContent =
    scenes.length;

  $("characterCount")
    .textContent =
    characters.length;

  $("eventCount")
    .textContent =
    events.length;

  $("storyType")
    .textContent =
    analysis.storyType ||
    "Story";

  $("resultTitle")
    .textContent =
    analysis.title ||
    "Story Analysis";

  $("resultSynopsis")
    .textContent =
    analysis.synopsis ||
    analysis.logline ||
    "No synopsis returned";

  renderCharacters(
    characters
  );

  renderEvents(
    events
  );

  renderScenes(
    scenes
  );

  analysisProgress.style.width =
    "100%";

  analysisPercent.textContent =
    "100%";

  analysisProgressText.textContent =
    "Analysis complete";

  setAnalysisState(
    "done",
    "AI video understanding completed"
  );

  analysisActions.style.display =
    "block";

  analyzeBtn.disabled =
    true;

  analysisBusy =
    false;

  showToast(
    "AI analysis completed successfully"
  );
}

/* =========================================================
   CHARACTERS
========================================================= */

function renderCharacters(
  characters
) {

  const list =
    $("characterList");

  if (
    !characters.length
  ) {

    list.innerHTML =
      `
        <div class="list-item">
          <span>
            No character data returned
          </span>
        </div>
      `;

    return;
  }

  list.innerHTML =
    characters
      .slice(
        0,
        30
      )
      .map(
        (character) => {

          const name =
            escapeHtml(
              character?.name ||
              "Unknown"
            );

          const role =
            escapeHtml(
              character?.role ||
              character?.description ||
              ""
            );

          return `
            <div class="list-item">
              <strong>
                ${name}
              </strong>

              <span>
                ${role}
              </span>
            </div>
          `;
        }
      )
      .join("");
}

/* =========================================================
   EVENTS
========================================================= */

function renderEvents(
  events
) {

  const list =
    $("eventList");

  if (
    !events.length
  ) {

    list.innerHTML =
      `
        <div class="list-item">
          <span>
            No key events returned
          </span>
        </div>
      `;

    return;
  }

  list.innerHTML =
    events
      .slice(
        0,
        30
      )
      .map(
        (event) => {

          const order =
            event?.order ??
            "";

          const timestamp =
            event?.timestamp ||
            "";

          const title =
            timestamp ||
            (
              order
                ? `Event ${order}`
                : "Key Event"
            );

          const text =
            escapeHtml(
              event?.event ||
              event?.description ||
              ""
            );

          const importance =
            escapeHtml(
              event?.importance ||
              ""
            );

          return `
            <div class="list-item">

              <strong>
                ${escapeHtml(
                  title
                )}
              </strong>

              <span>
                ${text}
                ${
                  importance
                    ? ` • ${importance}`
                    : ""
                }
              </span>

            </div>
          `;
        }
      )
      .join("");
}

/* =========================================================
   SCENES
========================================================= */

function renderScenes(
  scenes
) {

  const list =
    $("sceneList");

  if (
    !scenes.length
  ) {

    list.innerHTML =
      `
        <div class="list-item">
          <span>
            No scene data returned
          </span>
        </div>
      `;

    return;
  }

  list.innerHTML =
    scenes
      .slice(
        0,
        100
      )
      .map(
        (scene, index) => {

          const start =
            escapeHtml(
              scene?.start ||
              scene?.startTime ||
              ""
            );

          const end =
            escapeHtml(
              scene?.end ||
              scene?.endTime ||
              ""
            );

          const sceneId =
            scene?.id ??
            scene?.order ??
            index + 1;

          const title =
            escapeHtml(
              scene?.title ||
              `Scene ${sceneId}`
            );

          const description =
            escapeHtml(
              scene?.description ||
              scene?.summary ||
              ""
            );

          const importance =
            escapeHtml(
              scene?.importance ||
              ""
            );

          return `
            <div class="scene">

              <div class="scene-time">
                ${start || "—"}
                ${
                  end
                    ? `–${end}`
                    : ""
                }
              </div>

              <div class="scene-main">

                <strong>
                  ${title}
                </strong>

                <span>
                  ${description}
                </span>

              </div>

              <div class="scene-importance">
                ${importance}
              </div>

            </div>
          `;
        }
      )
      .join("");
}

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

/* =========================================================
   RETRY BUTTON
========================================================= */

retryBtn.addEventListener(
  "click",
  () => {

    if (
      !currentJobId
    ) {

      showToast(
        "Upload a video first"
      );

      return;
    }

    if (
      retryCountdownTimer
    ) {

      clearInterval(
        retryCountdownTimer
      );

      retryCountdownTimer =
        null;
    }

    analysisBusy =
      false;

    analysisActions.style.display =
      "none";

    startAnalysis();
  }
);

/* =========================================================
   CONTINUE
========================================================= */

continueBtn.addEventListener(
  "click",
  () => {

    const studioButton =
      document.querySelector(
        '[data-module="studio"]'
      );

    if (
      studioButton
    ) {

      studioButton.click();
    }

    showToast(
      "Recap Studio will be connected in the next engine"
    );
  }
);

/* =========================================================
   STARTUP
========================================================= */

checkApi();

setInterval(
  checkApi,
  30000
);

</script>
