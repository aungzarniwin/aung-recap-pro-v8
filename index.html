<script>
"use strict";

/* =========================================================
   AUNG RECAP PRO V8.2
   COMPLETE FRONTEND SCRIPT

   Flow:
   Select Video
      ↓
   Upload
      ↓
   Job ID
      ↓
   Analyze
      ↓
   Poll Job
      ↓
   Result

   Improvements:
   - Stable upload state
   - jobId / job.id / id compatibility
   - 429 rate-limit protection
   - NO automatic retry after 429
   - Manual retry after cooldown
   - Double-click protection
   - Temporary polling recovery
   - Result compatibility
   - Safe HTML rendering
   - Reset state cleanup
   ========================================================= */


/* =========================================================
   CONFIG
   ========================================================= */

const API_BASE =
  "https://aung-recap-pro-v8-1.onrender.com";

const MAX_FILE_SIZE =
  500 * 1024 * 1024;

const POLL_INTERVAL =
  2500;

const POLL_ERROR_INTERVAL =
  5000;

const API_TIMEOUT =
  120000;


/* =========================================================
   STATE
   ========================================================= */

let selectedFile = null;

let currentJobId = null;

let pollTimer = null;

let uploadBusy = false;

let analysisBusy = false;

let retryCountdownTimer = null;

let retryRemaining = 0;

let toastTimer = null;

let apiCheckBusy = false;

let destroyed = false;


/* =========================================================
   ELEMENT HELPER
   ========================================================= */

const $ = (id) =>
  document.getElementById(id);


/* =========================================================
   DOM ELEMENTS
   ========================================================= */

const sidebar =
  $("sidebar");

const overlay =
  $("overlay");

const mobileMenu =
  $("mobileMenu");

const chooseBtn =
  $("chooseBtn");

const videoInput =
  $("videoInput");

const dropzone =
  $("dropzone");

const uploadBtn =
  $("uploadBtn");

const resetBtn =
  $("resetBtn");

const analyzeBtn =
  $("analyzeBtn");

const fileInfo =
  $("fileInfo");

const fileName =
  $("fileName");

const fileMeta =
  $("fileMeta");

const uploadProgressWrap =
  $("uploadProgressWrap");

const uploadProgress =
  $("uploadProgress");

const uploadPercent =
  $("uploadPercent");

const uploadStage =
  $("uploadStage");

const analysisPanel =
  $("analysisPanel");

const analysisStatus =
  $("analysisStatus");

const analysisStage =
  $("analysisStage");

const analysisProgress =
  $("analysisProgress");

const analysisPercent =
  $("analysisPercent");

const analysisProgressText =
  $("analysisProgressText");

const analysisActions =
  $("analysisActions");

const retryBtn =
  $("retryBtn");

const continueBtn =
  $("continueBtn");

const toast =
  $("toast");


/* =========================================================
   SAFE DOM HELPERS
   ========================================================= */

function setText(element, value) {

  if (!element) {
    return;
  }

  element.textContent =
    String(value ?? "");
}


function setDisabled(element, disabled) {

  if (!element) {
    return;
  }

  element.disabled =
    Boolean(disabled);
}


function setWidth(element, percent) {

  if (!element) {
    return;
  }

  const safe =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );

  element.style.width =
    `${safe}%`;
}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(message) {

  if (!toast) {
    return;
  }

  clearTimeout(
    toastTimer
  );

  toast.textContent =
    String(message || "");

  toast.classList.add(
    "show"
  );

  toastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    }, 4500);
}


/* =========================================================
   FORMAT BYTES
   ========================================================= */

function formatBytes(bytes) {

  if (
    !Number.isFinite(bytes) ||
    bytes < 0
  ) {

    return "Unknown size";
  }

  if (
    bytes < 1024
  ) {

    return `${bytes} B`;
  }

  if (
    bytes <
    1024 * 1024
  ) {

    return `${(
      bytes / 1024
    ).toFixed(1)} KB`;
  }

  if (
    bytes <
    1024 *
    1024 *
    1024
  ) {

    return `${(
      bytes /
      (1024 * 1024)
    ).toFixed(1)} MB`;
  }

  return `${(
    bytes /
    (1024 *
      1024 *
      1024)
  ).toFixed(2)} GB`;
}


/* =========================================================
   JSON RESPONSE HELPER
   ========================================================= */

async function readJsonSafe(
  response
) {

  try {

    return await response.json();

  } catch {

    return null;
  }
}


/* =========================================================
   REQUEST WITH TIMEOUT
   ========================================================= */

async function fetchWithTimeout(
  url,
  options = {},
  timeout = API_TIMEOUT
) {

  const controller =
    new AbortController();

  const timeoutId =
    setTimeout(
      () => controller.abort(),
      timeout
    );

  try {

    return await fetch(
      url,
      {
        ...options,
        signal:
          controller.signal
      }
    );

  } finally {

    clearTimeout(
      timeoutId
    );
  }
}


/* =========================================================
   ERROR MESSAGE
   ========================================================= */

function getErrorMessage(
  data,
  fallback
) {

  if (
    typeof data ===
    "string" &&
    data.trim()
  ) {

    return data.trim();
  }

  if (
    data?.error?.message
  ) {

    return String(
      data.error.message
    );
  }

  if (
    typeof data?.error ===
    "string"
  ) {

    return data.error;
  }

  if (
    typeof data?.message ===
    "string"
  ) {

    return data.message;
  }

  return fallback ||
    "Something went wrong";
}


/* =========================================================
   JOB ID RESOLVER
   ========================================================= */

function resolveJobId(
  data
) {

  const candidates = [

    data?.jobId,

    data?.job?.id,

    data?.job?.jobId,

    data?.id,

    data?.result?.jobId,

    data?.result?.job?.id

  ];

  for (
    const value of candidates
  ) {

    if (
      value !== undefined &&
      value !== null &&
      String(value).trim()
    ) {

      return String(value);
    }
  }

  return null;
}


/* =========================================================
   RESULT RESOLVER
   ========================================================= */

function resolveResult(
  data
) {

  if (
    data?.result
  ) {

    return data.result;
  }

  if (
    data?.job?.result
  ) {

    return data.job.result;
  }

  if (
    data?.analysis
  ) {

    return {
      analysis:
        data.analysis
    };
  }

  if (
    data?.job?.analysis
  ) {

    return {
      analysis:
        data.job.analysis
    };
  }

  return null;
}


/* =========================================================
   RATE LIMIT DETECTION
   ========================================================= */

function isRateLimitMessage(
  value
) {

  let message = "";

  if (
    value instanceof Error
  ) {

    message =
      value.message || "";

  } else if (
    typeof value ===
    "string"
  ) {

    message =
      value;

  } else if (
    value
  ) {

    try {

      message =
        JSON.stringify(
          value
        );

    } catch {

      message =
        String(value);
    }
  }

  message =
    message.toLowerCase();

  return (
    message.includes(
      "429"
    ) ||
    message.includes(
      "rate limit"
    ) ||
    message.includes(
      "rate_limit_exceeded"
    ) ||
    message.includes(
      "resource_exhausted"
    ) ||
    message.includes(
      "too many requests"
    ) ||
    message.includes(
      "quota"
    )
  );
}


/* =========================================================
   RETRY SECONDS
   ========================================================= */

function extractRetrySeconds(
  value
) {

  let message = "";

  if (
    value instanceof Error
  ) {

    message =
      value.message || "";

  } else if (
    typeof value ===
    "string"
  ) {

    message =
      value;

  } else if (
    value
  ) {

    try {

      message =
        JSON.stringify(
          value
        );

    } catch {

      message =
        String(value);
    }
  }

  const patterns = [

    /retry\s+(?:in|after)\s+(\d+)\s*s/i,

    /retry\s+(?:in|after)\s+(\d+)\s*seconds?/i,

    /retryDelay["']?\s*:\s*["']?(\d+)s/i,

    /(\d+)\s*seconds?/i

  ];

  for (
    const pattern of patterns
  ) {

    const match =
      message.match(
        pattern
      );

    if (
      match &&
      Number.isFinite(
        Number(match[1])
      )
    ) {

      return Math.min(
        Math.max(
          Number(match[1]),
          5
        ),
        300
      );
    }
  }

  return 60;
}


/* =========================================================
   RETRY HEADER
   ========================================================= */

function getRetryAfterHeader(
  response
) {

  if (!response) {
    return null;
  }

  const value =
    response.headers.get(
      "Retry-After"
    );

  if (!value) {
    return null;
  }

  const seconds =
    Number(value);

  if (
    Number.isFinite(seconds) &&
    seconds > 0
  ) {

    return Math.min(
      Math.max(
        Math.ceil(seconds),
        5
      ),
      300
    );
  }

  return null;
}


/* =========================================================
   API HEALTH
   ========================================================= */

async function checkApi() {

  if (
    apiCheckBusy ||
    destroyed
  ) {

    return false;
  }

  apiCheckBusy =
    true;

  const dot =
    $("apiDot");

  const text =
    $("apiText");

  try {

    const response =
      await fetchWithTimeout(
        `${API_BASE}/health`,
        {
          method:
            "GET",
          cache:
            "no-store"
        },
        15000
      );

    const data =
      await readJsonSafe(
        response
      );

    if (
      response.ok &&
      data?.ok === true
    ) {

      if (dot) {

        dot.className =
          "api-dot online";
      }

      if (text) {

        text.textContent =
          `API Online • ${
            data.version ||
            "V8"
          }`;
      }

      return true;
    }

    throw new Error(
      getErrorMessage(
        data,
        `HTTP ${response.status}`
      )
    );

  } catch (error) {

    console.error(
      "API HEALTH:",
      error
    );

    if (dot) {

      dot.className =
        "api-dot error";
    }

    if (text) {

      text.textContent =
        "API Offline";
    }

    return false;

  } finally {

    apiCheckBusy =
      false;
  }
}


/* =========================================================
   MOBILE MENU
   ========================================================= */

function openMenu() {

  if (sidebar) {

    sidebar.classList.add(
      "open"
    );
  }

  if (overlay) {

    overlay.classList.add(
      "show"
    );
  }
}


function closeMenu() {

  if (sidebar) {

    sidebar.classList.remove(
      "open"
    );
  }

  if (overlay) {

    overlay.classList.remove(
      "show"
    );
  }
}


if (mobileMenu) {

  mobileMenu.addEventListener(
    "click",
    openMenu
  );
}


if (overlay) {

  overlay.addEventListener(
    "click",
    closeMenu
  );
}


/* =========================================================
   NAVIGATION
   ========================================================= */

const pageNames = {

  create:
    "Create Recap",

  studio:
    "Recap Studio",

  projects:
    "Projects",

  voice:
    "AI Voice",

  subtitles:
    "Subtitles",

  settings:
    "Settings"

};


document
  .querySelectorAll(
    ".nav-btn"
  )
  .forEach(
    (button) => {

      button.addEventListener(
        "click",
        () => {

          const module =
            button.dataset.module;

          document
            .querySelectorAll(
              ".nav-btn"
            )
            .forEach(
              (item) => {

                item.classList.remove(
                  "active"
                );

              }
            );

          button.classList.add(
            "active"
          );

          document
            .querySelectorAll(
              ".module"
            )
            .forEach(
              (item) => {

                item.classList.remove(
                  "active"
                );

              }
            );

          const target =
            $(
              `module-${module}`
            );

          if (target) {

            target.classList.add(
              "active"
            );
          }

          const title =
            $("pageTitle");

          if (title) {

            title.textContent =
              pageNames[module] ||
              "AUNG RECAP PRO";
          }

          closeMenu();

          window.scrollTo(
            {
              top: 0,
              behavior:
                "smooth"
            }
          );
        }
      );

    }
  );


/* =========================================================
   FILE VALIDATION
   ========================================================= */

function isVideoFile(
  file
) {

  if (!file) {
    return false;
  }

  if (
    file.type &&
    file.type.startsWith(
      "video/"
    )
  ) {

    return true;
  }

  const name =
    String(
      file.name || ""
    ).toLowerCase();

  return /\.(mp4|mov|m4v|webm|avi|mkv|mpeg|mpg)$/i
    .test(name);
}


/* =========================================================
   FILE SELECTION
   ========================================================= */

function handleFile(
  file
) {

  if (!file) {
    return;
  }

  if (
    !isVideoFile(file)
  ) {

    showToast(
      "Please select a video file"
    );

    return;
  }

  if (
    file.size >
    MAX_FILE_SIZE
  ) {

    showToast(
      "Video must be 500 MB or smaller"
    );

    return;
  }

  stopPolling();

  clearRetryCountdown();

  selectedFile =
    file;

  currentJobId =
    null;

  uploadBusy =
    false;

  analysisBusy =
    false;

  setDisabled(
    uploadBtn,
    false
  );

  setDisabled(
    analyzeBtn,
    true
  );

  if (fileName) {

    fileName.textContent =
      file.name;
  }

  if (fileMeta) {

    fileMeta.textContent =
      `${formatBytes(
        file.size
      )} • ${
        file.type ||
        "video"
      }`;
  }

  if (fileInfo) {

    fileInfo.classList.add(
      "show"
    );
  }

  if (analysisPanel) {

    analysisPanel.classList.remove(
      "show"
    );
  }

  resetUploadVisuals();

  showToast(
    "Video selected — click Upload Video"
  );
}


/* =========================================================
   FILE INPUT
   ========================================================= */

if (chooseBtn) {

  chooseBtn.addEventListener(
    "click",
    () => {

      if (videoInput) {

        videoInput.click();
      }

    }
  );
}


if (videoInput) {

  videoInput.addEventListener(
    "change",
    () => {

      const file =
        videoInput.files?.[0];

      handleFile(file);
    }
  );
}


/* =========================================================
   DRAG & DROP
   ========================================================= */

[
  "dragenter",
  "dragover"
].forEach(
  (eventName) => {

    if (!dropzone) {
      return;
    }

    dropzone.addEventListener(
      eventName,
      (event) => {

        event.preventDefault();

        event.stopPropagation();

        dropzone.classList.add(
          "drag"
        );

      }
    );
  }
);


[
  "dragleave",
  "drop"
].forEach(
  (eventName) => {

    if (!dropzone) {
      return;
    }

    dropzone.addEventListener(
      eventName,
      (event) => {

        event.preventDefault();

        event.stopPropagation();

        dropzone.classList.remove(
          "drag"
        );

      }
    );
  }
);


if (dropzone) {

  dropzone.addEventListener(
    "drop",
    (event) => {

      const file =
        event
          .dataTransfer
          ?.files?.[0];

      handleFile(file);
    }
  );
}


/* =========================================================
   UPLOAD VISUAL RESET
   ========================================================= */

function resetUploadVisuals() {

  if (
    uploadProgressWrap
  ) {

    uploadProgressWrap.classList.remove(
      "show"
    );
  }

  setWidth(
    uploadProgress,
    0
  );

  setText(
    uploadPercent,
    "0%"
  );

  setText(
    uploadStage,
    "Uploading video"
  );
}


/* =========================================================
   ANALYSIS VISUAL RESET
   ========================================================= */

function resetAnalysisVisuals() {

  setWidth(
    analysisProgress,
    0
  );

  setText(
    analysisPercent,
    "0%"
  );

  setText(
    analysisProgressText,
    "Preparing AI analysis"
  );

  setText(
    analysisStage,
    "Waiting for analysis"
  );

  if (analysisStatus) {

    analysisStatus.className =
      "status-pill";

    analysisStatus.textContent =
      "● Ready";
  }

  if (analysisActions) {

    analysisActions.style.display =
      "none";
  }
}


/* =========================================================
   STOP POLLING
   ========================================================= */

function stopPolling() {

  if (pollTimer) {

    clearTimeout(
      pollTimer
    );

    pollTimer =
      null;
  }
}


/* =========================================================
   CLEAR RATE LIMIT COUNTDOWN
   ========================================================= */

function clearRetryCountdown() {

  if (
    retryCountdownTimer
  ) {

    clearInterval(
      retryCountdownTimer
    );

    retryCountdownTimer =
      null;
  }

  retryRemaining =
    0;
}


/* =========================================================
   RESET ALL
   ========================================================= */

function resetAll() {

  stopPolling();

  clearRetryCountdown();

  selectedFile =
    null;

  currentJobId =
    null;

  uploadBusy =
    false;

  analysisBusy =
    false;

  if (videoInput) {

    videoInput.value =
      "";
  }

  if (fileInfo) {

    fileInfo.classList.remove(
      "show"
    );
  }

  resetUploadVisuals();

  resetAnalysisVisuals();

  setDisabled(
    uploadBtn,
    true
  );

  setDisabled(
    analyzeBtn,
    true
  );

  if (analysisPanel) {

    analysisPanel.classList.remove(
      "show"
    );
  }

  setText(
    $("sceneCount"),
    "—"
  );

  setText(
    $("characterCount"),
    "—"
  );

  setText(
    $("eventCount"),
    "—"
  );

  setText(
    $("storyType"),
    "—"
  );

  setText(
    $("resultTitle"),
    "Story Analysis"
  );

  setText(
    $("resultSynopsis"),
    "AI analysis results will appear here"
  );

  const characterList =
    $("characterList");

  if (characterList) {

    characterList.innerHTML = `
      <div class="list-item">
        <span>
          Waiting for AI analysis
        </span>
      </div>
    `;
  }

  const eventList =
    $("eventList");

  if (eventList) {

    eventList.innerHTML = `
      <div class="list-item">
        <span>
          Waiting for AI analysis
        </span>
      </div>
    `;
  }

  const sceneList =
    $("sceneList");

  if (sceneList) {

    sceneList.innerHTML = `
      <div class="list-item">
        <span>
          Scene analysis will appear here
        </span>
      </div>
    `;
  }

  showToast(
    "Reset complete"
  );
}


if (resetBtn) {

  resetBtn.addEventListener(
    "click",
    resetAll
  );
}


/* =========================================================
   UPLOAD VIDEO
   ========================================================= */

function uploadVideo() {

  if (
    !selectedFile
  ) {

    showToast(
      "Choose a video first"
    );

    return;
  }

  if (
    uploadBusy
  ) {

    return;
  }

  stopPolling();

  clearRetryCountdown();

  uploadBusy =
    true;

  analysisBusy =
    false;

  currentJobId =
    null;

  setDisabled(
    uploadBtn,
    true
  );

  setDisabled(
    analyzeBtn,
    true
  );

  if (
    uploadProgressWrap
  ) {

    uploadProgressWrap.classList.add(
      "show"
    );
  }

  setWidth(
    uploadProgress,
    0
  );

  setText(
    uploadPercent,
    "0%"
  );

  setText(
    uploadStage,
    "Uploading video"
  );

  const xhr =
    new XMLHttpRequest();

  xhr.open(
    "POST",
    `${API_BASE}/api/upload`,
    true
  );

  xhr.timeout =
    15 * 60 * 1000;

  xhr.responseType =
    "json";


  /* -------------------------------------------------------
     UPLOAD PROGRESS
     ------------------------------------------------------- */

  xhr.upload.addEventListener(
    "progress",
    (event) => {

      if (
        !event.lengthComputable
      ) {

        return;
      }

      const percent =
        Math.round(
          (
            event.loaded /
            event.total
          ) * 100
        );

      setWidth(
        uploadProgress,
        percent
      );

      setText(
        uploadPercent,
        `${percent}%`
      );

      setText(
        uploadStage,
        percent >= 100
          ? "Processing upload..."
          : "Uploading video"
      );
    }
  );


  /* -------------------------------------------------------
     UPLOAD COMPLETE
     ------------------------------------------------------- */

  xhr.addEventListener(
    "load",
    () => {

      uploadBusy =
        false;

      let data =
        xhr.response;

      if (
        !data &&
        xhr.responseText
      ) {

        try {

          data =
            JSON.parse(
              xhr.responseText
            );

        } catch {

          data =
            null;
        }
      }


      /* ---------------------------------------------------
         SUCCESS
         --------------------------------------------------- */

      if (
        xhr.status >= 200 &&
        xhr.status < 300
      ) {

        const jobId =
          resolveJobId(
            data
          );

        if (!jobId) {

          console.error(
            "INVALID UPLOAD RESPONSE:",
            data
          );

          setDisabled(
            uploadBtn,
            false
          );

          setDisabled(
            analyzeBtn,
            true
          );

          showToast(
            "Upload completed but Job ID was not received"
          );

          return;
        }

        currentJobId =
          jobId;

        setWidth(
          uploadProgress,
          100
        );

        setText(
          uploadPercent,
          "100%"
        );

        setText(
          uploadStage,
          "Upload complete"
        );

        /*
         * IMPORTANT:
         * Analyze is enabled ONLY after
         * a valid Job ID exists
         */

        setDisabled(
          analyzeBtn,
          false
        );

        setDisabled(
          uploadBtn,
          false
        );

        showToast(
          "Video uploaded — Analyze Video is ready"
        );

        return;
      }


      /* ---------------------------------------------------
         429 DURING UPLOAD
         --------------------------------------------------- */

      if (
        xhr.status === 429
      ) {

        const seconds =
          getRetryAfterHeader(
            xhr
          ) ||
          extractRetrySeconds(
            data
          );

        setDisabled(
          uploadBtn,
          false
        );

        setDisabled(
          analyzeBtn,
          true
        );

        startRetryCountdown(
          seconds,
          "upload"
        );

        return;
      }


      /* ---------------------------------------------------
         UPLOAD ERROR
         --------------------------------------------------- */

      const message =
        getErrorMessage(
          data,
          `Upload failed (HTTP ${xhr.status})`
        );

      setDisabled(
        uploadBtn,
        false
      );

      setDisabled(
        analyzeBtn,
        true
      );

      showToast(
        message
      );
    }
  );


  /* -------------------------------------------------------
     NETWORK ERROR
     ------------------------------------------------------- */

  xhr.addEventListener(
    "error",
    () => {

      uploadBusy =
        false;

      setDisabled(
        uploadBtn,
        false
      );

      setDisabled(
        analyzeBtn,
        true
      );

      showToast(
        "Network error during upload"
      );
    }
  );


  /* -------------------------------------------------------
     ABORT
     ------------------------------------------------------- */

  xhr.addEventListener(
    "abort",
    () => {

      uploadBusy =
        false;

      setDisabled(
        uploadBtn,
        false
      );

      setDisabled(
        analyzeBtn,
        true
      );

      showToast(
        "Upload cancelled"
      );
    }
  );


  /* -------------------------------------------------------
     TIMEOUT
     ------------------------------------------------------- */

  xhr.addEventListener(
    "timeout",
    () => {

      uploadBusy =
        false;

      setDisabled(
        uploadBtn,
        false
      );

      setDisabled(
        analyzeBtn,
        true
      );

      showToast(
        "Upload timed out"
      );
    }
  );


  /* -------------------------------------------------------
     SEND
     ------------------------------------------------------- */

  const formData =
    new FormData();

  formData.append(
    "video",
    selectedFile
  );

  xhr.send(
    formData
  );
}

/* =========================================================
   ANALYSIS STATE
   ========================================================= */

function setAnalysisState(
  state,
  message
) {

  if (analysisPanel) {

    analysisPanel.classList.add(
      "show"
    );
  }


  if (
    state ===
    "running"
  ) {

    if (analysisStatus) {

      analysisStatus.className =
        "status-pill running";

      analysisStatus.textContent =
        "● Analyzing";
    }

    setText(
      analysisStage,
      message ||
      "AI is analyzing the video"
    );

    return;
  }


  if (
    state ===
    "waiting"
  ) {

    if (analysisStatus) {

      analysisStatus.className =
        "status-pill running";

      analysisStatus.textContent =
        "● Waiting";
    }

    setText(
      analysisStage,
      message ||
      "Waiting for Gemini"
    );

    return;
  }


  if (
    state ===
    "done"
  ) {

    if (analysisStatus) {

      analysisStatus.className =
        "status-pill done";

      analysisStatus.textContent =
        "● Complete";
    }

    setText(
      analysisStage,
      message ||
      "AI analysis complete"
    );

    return;
  }


  if (
    state ===
    "failed"
  ) {

    if (analysisStatus) {

      analysisStatus.className =
        "status-pill failed";

      analysisStatus.textContent =
        "● Failed";
    }

    setText(
      analysisStage,
      message ||
      "AI analysis failed"
    );

    return;
  }


  if (analysisStatus) {

    analysisStatus.className =
      "status-pill";

    analysisStatus.textContent =
      "● Ready";
  }

  setText(
    analysisStage,
    message ||
    "Waiting for analysis"
  );
}


/* =========================================================
   START ANALYSIS
   ========================================================= */

async function startAnalysis() {

  if (
    !currentJobId
  ) {

    showToast(
      "Upload the video first"
    );

    return;
  }

  if (
    analysisBusy
  ) {

    return;
  }

  if (
    retryCountdownTimer
  ) {

    showToast(
      `Please wait ${retryRemaining}s before retrying`
    );

    return;
  }

  analysisBusy =
    true;

  setDisabled(
    analyzeBtn,
    true
  );

  if (analysisActions) {

    analysisActions.style.display =
      "none";
  }

  if (analysisPanel) {

    analysisPanel.classList.add(
      "show"
    );
  }

  setAnalysisState(
    "running",
    "Starting AI analysis..."
  );

  setWidth(
    analysisProgress,
    10
  );

  setText(
    analysisPercent,
    "10%"
  );

  setText(
    analysisProgressText,
    "Starting AI analysis"
  );


  const payload = {

    sourceLanguage:
      $("sourceLanguage")
        ?.value ||
      "auto",

    outputLanguage:
      $("outputLanguage")
        ?.value ||
      "my",

    outputFormat:
      $("outputFormat")
        ?.value ||
      "original",

    recapStyle:
      $("recapStyle")
        ?.value ||
      "cinematic"

  };


  try {

    const response =
      await fetchWithTimeout(
        `${API_BASE}/api/analyze/${encodeURIComponent(
          currentJobId
        )}/start`,
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            )
        },
        120000
      );


    const data =
      await readJsonSafe(
        response
      );


    /* -----------------------------------------------------
       429
       ----------------------------------------------------- */

    if (
      response.status ===
      429
    ) {

      analysisBusy =
        false;

      const seconds =
        getRetryAfterHeader(
          response
        ) ||
        extractRetrySeconds(
          data
        );

      startRetryCountdown(
        seconds,
        "analysis"
      );

      return;
    }


    /* -----------------------------------------------------
       OTHER ERROR
       ----------------------------------------------------- */

    if (
      !response.ok
    ) {

      throw new Error(
        getErrorMessage(
          data,
          `AI analysis failed (HTTP ${response.status})`
        )
      );
    }


    /* -----------------------------------------------------
       UPDATE JOB ID IF BACKEND RETURNS ONE
       ----------------------------------------------------- */

    const returnedJobId =
      resolveJobId(
        data
      );

    if (
      returnedJobId
    ) {

      currentJobId =
        returnedJobId;
    }


    /* -----------------------------------------------------
       DIRECT RESULT
       ----------------------------------------------------- */

    const directResult =
      resolveResult(
        data
      );

    if (
      directResult
    ) {

      analysisBusy =
        false;

      renderAnalysis(
        {
          result:
            directResult,

          status:
            "completed",

          progress:
            100
        }
      );

      return;
    }


    /* -----------------------------------------------------
       ALREADY COMPLETED
       ----------------------------------------------------- */

    if (
      data?.alreadyCompleted
    ) {

      const result =
        resolveResult(
          data
        );

      if (result) {

        analysisBusy =
          false;

        renderAnalysis(
          {
            result,
            status:
              "completed",
            progress:
              100
          }
        );

        return;
      }
    }


    showToast(
      "AI analysis started"
    );

    setAnalysisState(
      "running",
      "AI analysis is processing..."
    );

    setWidth(
      analysisProgress,
      15
    );

    setText(
      analysisPercent,
      "15%"
    );

    setText(
      analysisProgressText,
      "AI processing started"
    );

    pollJob();


  } catch (error) {

    console.error(
      "ANALYSIS START:",
      error
    );

    analysisBusy =
      false;


    /* -----------------------------------------------------
       RATE LIMIT FROM ERROR
       ----------------------------------------------------- */

    if (
      isRateLimitMessage(
        error
      )
    ) {

      const seconds =
        extractRetrySeconds(
          error
        );

      startRetryCountdown(
        seconds,
        "analysis"
      );

      return;
    }


    /* -----------------------------------------------------
       ABORT / TIMEOUT
       ----------------------------------------------------- */

    if (
      error?.name ===
      "AbortError"
    ) {

      setDisabled(
        analyzeBtn,
        false
      );

      setAnalysisState(
        "failed",
        "Analysis request timed out"
      );

      if (analysisActions) {

        analysisActions.style.display =
          "block";
      }

      showToast(
        "Analysis request timed out"
      );

      return;
    }


    /* -----------------------------------------------------
       NORMAL ERROR
       ----------------------------------------------------- */

    setDisabled(
      analyzeBtn,
      false
    );

    setAnalysisState(
      "failed",
      error?.message ||
      "Could not start AI analysis"
    );

    if (analysisActions) {

      analysisActions.style.display =
        "block";
    }

    showToast(
      error?.message ||
      "Could not start AI analysis"
    );
  }
}


if (analyzeBtn) {

  analyzeBtn.addEventListener(
    "click",
    startAnalysis
  );
}


/* =========================================================
   RATE LIMIT COUNTDOWN
   =========================================================

   IMPORTANT:
   We DO NOT automatically call startAnalysis()
   after the countdown.

   User must press Analyze again.

   This prevents repeated Gemini 429 requests.
   ========================================================= */

function startRetryCountdown(
  seconds,
  source = "analysis"
) {

  clearRetryCountdown();

  retryRemaining =
    Math.max(
      1,
      Number(seconds) ||
      60
    );

  analysisBusy =
    false;

  if (
    source ===
    "analysis"
  ) {

    setDisabled(
      analyzeBtn,
      true
    );

    setAnalysisState(
      "waiting",
      `Gemini rate limit reached — wait ${retryRemaining}s`
    );

    setWidth(
      analysisProgress,
      58
    );

    setText(
      analysisPercent,
      "58%"
    );

    setText(
      analysisProgressText,
      `Retry available in ${retryRemaining}s`
    );

  } else {

    setDisabled(
      uploadBtn,
      true
    );

    setText(
      uploadStage,
      `Retry available in ${retryRemaining}s`
    );
  }

  showToast(
    `Rate limit reached — wait ${retryRemaining}s`
  );


  retryCountdownTimer =
    setInterval(
      () => {

        retryRemaining--;

        if (
          retryRemaining <= 0
        ) {

          clearRetryCountdown();

          if (
            source ===
            "analysis"
          ) {

            /*
             * IMPORTANT:
             * Do not auto-run Gemini.
             */

            setDisabled(
              analyzeBtn,
              !currentJobId
            );

            setAnalysisState(
              "failed",
              "Cooldown finished — click Analyze Video to try again"
            );

            setText(
              analysisProgressText,
              "Ready for manual retry"
            );

            showToast(
              "Cooldown finished — Analyze Video is ready"
            );

          } else {

            setDisabled(
              uploadBtn,
              !selectedFile
            );

            setText(
              uploadStage,
              "Ready to upload"
            );

            showToast(
              "Upload is ready to retry"
            );
          }

          return;
        }


        if (
          source ===
          "analysis"
        ) {

          setText(
            analysisStage,
            `Gemini rate limit reached — wait ${retryRemaining}s`
          );

          setText(
            analysisProgressText,
            `Retry available in ${retryRemaining}s`
          );

        } else {

          setText(
            uploadStage,
            `Retry available in ${retryRemaining}s`
          );
        }

      },
      1000
    );
}


/* =========================================================
   POLL JOB
   ========================================================= */

async function pollJob() {

  if (
    !currentJobId ||
    destroyed
  ) {

    return;
  }

  try {

    const response =
      await fetchWithTimeout(
        `${API_BASE}/api/jobs/${encodeURIComponent(
          currentJobId
        )}`,
        {
          method:
            "GET",

          cache:
            "no-store"
        },
        30000
      );


    const data =
      await readJsonSafe(
        response
      );


    /* -----------------------------------------------------
       POLL HTTP ERROR
       ----------------------------------------------------- */

    if (
      response.status ===
      429
    ) {

      const seconds =
        getRetryAfterHeader(
          response
        ) ||
        extractRetrySeconds(
          data
        );

      analysisBusy =
        false;

      startRetryCountdown(
        seconds,
        "analysis"
      );

      return;
    }


    if (
      !response.ok
    ) {

      throw new Error(
        getErrorMessage(
          data,
          `Unable to read job status (HTTP ${response.status})`
        )
      );
    }


    /* -----------------------------------------------------
       ACCEPT DIFFERENT RESPONSE SHAPES
       ----------------------------------------------------- */

    const job =
      data?.job ||
      data?.result?.job ||
      data;


    if (
      !job ||
      typeof job !==
      "object"
    ) {

      throw new Error(
        "Invalid job response"
      );
    }


    const progress =
      Math.max(
        0,
        Math.min(
          100,
          Number(
            job.progress ??
            data.progress ??
            0
          ) || 0
        )
      );


    setWidth(
      analysisProgress,
      progress
    );

    setText(
      analysisPercent,
      `${progress}%`
    );


    const message =
      job.message ||
      job.stage ||
      job.statusMessage ||
      data.message ||
      "AI processing";


    setText(
      analysisProgressText,
      message
    );


    /* -----------------------------------------------------
       COMPLETED
       ----------------------------------------------------- */

    if (
      job.status ===
      "completed" ||
      job.status ===
      "complete" ||
      job.status ===
      "done" ||
      data.status ===
      "completed"
    ) {

      analysisBusy =
        false;

      stopPolling();

      renderAnalysis(
        job
      );

      return;
    }


    /* -----------------------------------------------------
       FAILED
       ----------------------------------------------------- */

    if (
      job.status ===
      "failed" ||
      job.status ===
      "error"
    ) {

      analysisBusy =
        false;

      stopPolling();

      const errorMessage =
        job.error ||
        job.message ||
        data.error ||
        data.message ||
        "AI analysis failed";


      if (
        isRateLimitMessage(
          errorMessage
        )
      ) {

        const seconds =
          extractRetrySeconds(
            errorMessage
          );

        startRetryCountdown(
          seconds,
          "analysis"
        );

        return;
      }


      setDisabled(
        analyzeBtn,
        false
      );

      setAnalysisState(
        "failed",
        errorMessage
      );

      if (analysisActions) {

        analysisActions.style.display =
          "block";
      }

      showToast(
        errorMessage
      );

      return;
    }


    /* -----------------------------------------------------
       WAITING
       ----------------------------------------------------- */

    if (
      job.status ===
      "waiting" ||
      job.status ===
      "queued" ||
      job.status ===
      "pending"
    ) {

      setAnalysisState(
        "waiting",
        message
      );

    } else {

      setAnalysisState(
        "running",
        message
      );
    }


    /* -----------------------------------------------------
       CONTINUE POLLING
       ----------------------------------------------------- */

    stopPolling();

    pollTimer =
      setTimeout(
        pollJob,
        POLL_INTERVAL
      );


  } catch (error) {

    console.error(
      "JOB POLL:",
      error
    );


    /*
     * Temporary network errors should not
     * immediately mark the job as failed.
     */

    if (
      isRateLimitMessage(
        error
      )
    ) {

      analysisBusy =
        false;

      const seconds =
        extractRetrySeconds(
          error
        );

      startRetryCountdown(
        seconds,
        "analysis"
      );

      return;
    }


    stopPolling();

    pollTimer =
      setTimeout(
        pollJob,
        POLL_ERROR_INTERVAL
      );
  }
}


/* =========================================================
   RENDER ANALYSIS
   ========================================================= */

function renderAnalysis(
  job
) {

  const result =
    job?.result ||
    job?.data ||
    {};

  const analysis =
    result?.analysis ||
    job?.analysis ||
    result ||
    {};


  const scenes =
    Array.isArray(
      analysis.scenes
    )
      ? analysis.scenes
      : [];


  const characters =
    Array.isArray(
      analysis.characters
    )
      ? analysis.characters
      : [];


  const events =
    Array.isArray(
      analysis.keyEvents
    )
      ? analysis.keyEvents
      : (
          Array.isArray(
            analysis.events
          )
            ? analysis.events
            : []
        );


  setText(
    $("sceneCount"),
    scenes.length
  );

  setText(
    $("characterCount"),
    characters.length
  );

  setText(
    $("eventCount"),
    events.length
  );

  setText(
    $("storyType"),
    analysis.storyType ||
    analysis.genre ||
    "Story"
  );


  setText(
    $("resultTitle"),
    analysis.title ||
    analysis.name ||
    "Story Analysis"
  );


  setText(
    $("resultSynopsis"),
    analysis.synopsis ||
    analysis.logline ||
    analysis.summary ||
    "No synopsis returned"
  );


  renderCharacters(
    characters
  );

  renderEvents(
    events
  );

  renderScenes(
    scenes
  );


  setWidth(
    analysisProgress,
    100
  );

  setText(
    analysisPercent,
    "100%"
  );

  setText(
    analysisProgressText,
    "Analysis complete"
  );


  setAnalysisState(
    "done",
    "AI video understanding completed"
  );


  if (analysisActions) {

    analysisActions.style.display =
      "block";
  }


  setDisabled(
    analyzeBtn,
    true
  );

  analysisBusy =
    false;

  stopPolling();

  showToast(
    "AI analysis completed successfully"
  );
}


/* =========================================================
   CHARACTERS
   ========================================================= */

function renderCharacters(
  characters
) {

  const list =
    $("characterList");

  if (!list) {
    return;
  }


  if (
    !Array.isArray(
      characters
    ) ||
    !characters.length
  ) {

    list.innerHTML = `
      <div class="list-item">
        <span>
          No character data returned
        </span>
      </div>
    `;

    return;
  }


  list.innerHTML =
    characters
      .slice(
        0,
        30
      )
      .map(
        (character) => {

          const name =
            escapeHtml(
              character?.name ||
              character?.character ||
              "Unknown"
            );


          const role =
            escapeHtml(
              character?.role ||
              character?.description ||
              character?.relationship ||
              ""
            );


          return `
            <div class="list-item">

              <strong>
                ${name}
              </strong>

              <span>
                ${role}
              </span>

            </div>
          `;
        }
      )
      .join("");
}


/* =========================================================
   EVENTS
   ========================================================= */

function renderEvents(
  events
) {

  const list =
    $("eventList");

  if (!list) {
    return;
  }


  if (
    !Array.isArray(
      events
    ) ||
    !events.length
  ) {

    list.innerHTML = `
      <div class="list-item">
        <span>
          No key events returned
        </span>
      </div>
    `;

    return;
  }


  list.innerHTML =
    events
      .slice(
        0,
        50
      )
      .map(
        (event) => {

          const order =
            event?.order ??
            "";


          const timestamp =
            event?.timestamp ||
            event?.time ||
            "";


          const title =
            timestamp ||
            (
              order
                ? `Event ${order}`
                : "Key Event"
            );


          const text =
            escapeHtml(
              event?.event ||
              event?.description ||
              event?.summary ||
              ""
            );


          const importance =
            escapeHtml(
              event?.importance ||
              ""
            );


          return `
            <div class="list-item">

              <strong>
                ${escapeHtml(
                  title
                )}
              </strong>

              <span>
                ${text}
                ${
                  importance
                    ? ` • ${importance}`
                    : ""
                }
              </span>

            </div>
          `;
        }
      )
      .join("");
}


/* =========================================================
   SCENES
   ========================================================= */

function renderScenes(
  scenes
) {

  const list =
    $("sceneList");

  if (!list) {
    return;
  }


  if (
    !Array.isArray(
      scenes
    ) ||
    !scenes.length
  ) {

    list.innerHTML = `
      <div class="list-item">
        <span>
          No scene data returned
        </span>
      </div>
    `;

    return;
  }


  list.innerHTML =
    scenes
      .slice(
        0,
        100
      )
      .map(
        (scene, index) => {

          const start =
            escapeHtml(
              scene?.start ||
              scene?.startTime ||
              scene?.timestamp ||
              ""
            );


          const end =
            escapeHtml(
              scene?.end ||
              scene?.endTime ||
              ""
            );


          const sceneId =
            scene?.id ??
            scene?.order ??
            index + 1;


          const title =
            escapeHtml(
              scene?.title ||
              scene?.name ||
              `Scene ${sceneId}`
            );


          const description =
            escapeHtml(
              scene?.description ||
              scene?.summary ||
              scene?.content ||
              ""
            );


          const importance =
            escapeHtml(
              scene?.importance ||
              ""
            );


          return `
            <div class="scene">

              <div class="scene-time">
                ${
                  start ||
                  "—"
                }
                ${
                  end
                    ? `–${end}`
                    : ""
                }
              </div>

              <div class="scene-main">

                <strong>
                  ${title}
                </strong>

                <span>
                  ${description}
                </span>

              </div>

              <div class="scene-importance">
                ${importance}
              </div>

            </div>
          `;
        }
      )
      .join("");
}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

  setDisabled(
    uploadBtn,
    true
  );

  setDisabled(
    analyzeBtn,
    true
  );


  /*
   * Initial visuals
   */

  resetUploadVisuals();

  resetAnalysisVisuals();


  /*
   * API health
   */

  checkApi();


  /*
   * Refresh API status every 30 seconds
   */

  setInterval(
    () => {

      if (
        !destroyed
      ) {

        checkApi();
      }

    },
    30000
  );

}


/* =========================================================
   BOOT
   ========================================================= */

if (
  document.readyState ===
  "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    initializeApp,
    {
      once: true
    }
  );

} else {

  initializeApp();
}

</script>
